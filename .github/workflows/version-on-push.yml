name: Version on push

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: version-on-main
  cancel-in-progress: false

jobs:
  bump-version:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Increase patch version
        id: version
        shell: bash
        run: |
          current=$(tr -d '[:space:]' < VERSION)
          IFS='.' read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          printf '%s\n' "$next" > VERSION
          node -e "for (const file of ['frontend/package.json', 'frontend/package-lock.json']) { const fs = require('fs'); const data = JSON.parse(fs.readFileSync(file, 'utf8')); data.version = '$next'; if (data.packages && data.packages['']) data.packages[''].version = '$next'; fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\\n'); }"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION frontend/package.json frontend/package-lock.json
          git commit -m "chore: bump version to $VERSION [skip version]"
          git tag "v$VERSION"
          git push origin HEAD:main --tags
